name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: vet
        run: go vet ./...

      - name: test-race
        run: go test -race ./...

      - name: coverage
        run: go test -coverprofile=coverage.out ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64  go build ./cmd/scomp
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64  go build ./cmd/scomp
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64  go build ./cmd/scomp
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64  go build ./cmd/scomp
