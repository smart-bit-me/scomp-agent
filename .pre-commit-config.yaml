repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        entry: gofmt -l -w
        language: golang
        types: [go]
        pass_filenames: true

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false

      - id: go-unit-tests
        name: go test -race
        entry: go test -race ./...
        language: system
        pass_filenames: false

      - id: cross-build-check
        name: cross-compile linux/amd64
        entry: bash -c 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/scomp'
        language: system
        pass_filenames: false
